# Full stack on one machine: Postgres, Redis, mock AWS (SQS), API and the Angular UI.
#   docker compose up --build        -> UI http://localhost:8080 , API http://localhost:8000/docs
# Expects the pulseboard-web repo checked out next to this one (../pulseboard-web).
name: pulseboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseboard
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseboard-local}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  sqs:  # mock AWS
    image: motoserver/moto:5.0.28
    ports: ["5000:5000"]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sqs: { condition: service_started }
    environment:
      PB_ENVIRONMENT: local
      PB_LOG_JSON: "true"
      PB_DATABASE_URL: postgresql+asyncpg://pulseboard:${POSTGRES_PASSWORD:-pulseboard-local}@postgres:5432/pulseboard
      PB_DB_AUTO_CREATE: "false"  # schema comes from Alembic in startup.sh
      PB_REDIS_URL: redis://redis:6379/0
      PB_QUEUE_BACKEND: sqs
      PB_AWS_ENDPOINT_URL: http://sqs:5000
      PB_CORS_ORIGINS: '["http://localhost:8080"]'
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]

  web:
    build: ../pulseboard-web
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://localhost:8000
      WS_URL: ws://localhost:8000/ws/events
    ports: ["8080:8080"]

volumes:
  pgdata:
