name: ci
on:
  push:
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  integration:
    # The real image against real Postgres, Redis and mock SQS, driven end to end by scripts/demo.py.
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pulseboard, POSTGRES_USER: pulseboard, POSTGRES_PASSWORD: ci-password }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pulseboard" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      sqs:
        image: motoserver/moto:5.0.28
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pulseboard-api:ci .
      - name: Start API
        run: |
          docker run -d --name api --network host \
            -e PB_ENVIRONMENT=ci \
            -e PB_DATABASE_URL=postgresql+asyncpg://pulseboard:ci-password@127.0.0.1:5432/pulseboard \
            -e PB_DB_AUTO_CREATE=false \
            -e PB_CACHE_BACKEND=redis -e PB_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e PB_QUEUE_BACKEND=sqs -e PB_AWS_ENDPOINT_URL=http://127.0.0.1:5000 \
            -e PB_SETUP_BUILD_DELAY_SECONDS=0.5 \
            pulseboard-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/readyz && exit 0; sleep 2; done
          docker logs api; exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx && python scripts/demo.py http://127.0.0.1:8000
      - run: curl -fs http://127.0.0.1:8000/readyz | grep '"cache":"up"'
      - if: failure()
        run: docker logs api
